<section class="contact" id="contact">
    <h2 class="title__Contact">Contactos</h2>
    <div class="form__cont">
        <div class="cont__form__data">
            <div class="data">
                <div class="logo__container">
                    <img class="logo__send" src="https://img.icons8.com/water-color/50/paper-plane.png" alt="">
                </div>
                <div>
                    <h3>Contactame</h3>
                    <span>Estoy disponible para nuevas oportunidades y proyectos</span>
                </div>
            </div>
        </div>
        <form #contactForm class="form" autocomplete="off" (submit)="sendEmail(contactForm)">

            <div class="form__input-cont">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Escribe tu nombre">
            </div>

            <div class="form__input-cont">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">
            </div>

            <div class="form__input-cont">
                <label for="subject">Asunto</label>
                <input type="text" id="subject" name="subject" placeholder="Escribe el asunto">
            </div>

             <div class="form__input-cont">
                <label for="message">Mensaje</label>
                <textarea id="message" name="message" placeholder="Escribe tu mensaje aqui..." ></textarea>
            </div>

            <div class="button__cont">
                <button class="send__button" type="submit">Enviar</button>
            </div>
        </form>
    </div>
</section>
